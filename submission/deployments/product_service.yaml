apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      imagePullSecrets:
      - name: ecr-secret
      
      containers:
      - name: product-service
        image: 944765969321.dkr.ecr.ap-south-2.amazonaws.com/product-service:latest

        ports:
        - containerPort: 3001

        env:
        - name: PORT
          value: "3001"

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5